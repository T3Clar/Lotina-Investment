<section class="bg-[#0B0B0B] py-24">

    <div class="mx-auto max-w-7xl px-6">

        <div class="mb-16 text-center">

            <p class="mb-3 text-sm font-semibold uppercase tracking-[4px] text-[var(--lotina-gold)]">
                Insights
            </p>

            <h1 class="mb-5 text-4xl font-bold text-[var(--lotina-black)] md:text-5xl">
                Explore Our Thinking
            </h1>

            <p class="mx-auto max-w-3xl text-lg leading-8 text-white">
                Browse insights across every area of the Lotina ecosystem.
            </p>

        </div>

        <div class="grid gap-8 md:grid-cols-2">

            <a
                *ngFor="let category of categories"
                [routerLink]="['/insights/category', category.slug]"
                class="group relative h-80 overflow-hidden rounded-3xl">

                <img
                    [src]="category.image"
                    [alt]="category.name"
                    class="absolute inset-0 h-full w-full object-cover transition duration-700 group-hover:scale-110">

                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>

                <div class="absolute inset-0 flex flex-col justify-end p-8">

                    <h2 class="mb-2 text-3xl font-bold text-white">
                        {{category.name}}
                    </h2>

                    <p class="mb-6 text-white/80">
                        {{category.tagline}}
                    </p>

                    <span class="font-semibold uppercase tracking-[2px] text-[var(--lotina-gold)]">
                        Explore Category →
                    </span>

                </div>

            </a>

        </div>

    </div>

</section>
