<section class="bg-[var(--lotina-black)]">

    <div class="mx-auto w-[92%] max-w-7xl">

        <div class="group relative overflow-hidden rounded-3xl border border-white/10">

            <!-- Background -->

            <img src="/fea.png" class="h-[450px] w-full object-cover transition duration-700 group-hover:scale-105">

            <!-- Gradient Overlay -->

            <div class="absolute inset-0 bg-gradient-to-r from-black/95 via-black/80 to-black/50">
            </div>
            <!-- Content -->

            <div class="absolute inset-0 z-10">
                <div class=" px-12 lg:px-14 pt-7">

                    <div class="max-w-2xl">

                        <!-- Label -->

                        <p class=" text-sm font-medium uppercase tracking-[4px] text-[var(--lotina-gold)]">

                            {{ featuredInsight.category }}

                        </p>

                        <!-- Title -->

                        <h2 class="text-4xl font-light leading-tight text-white lg:text-5xl mb-7">

                            {{ featuredInsight.title }}

                        </h2>

                        <!-- Description -->

                        <p class=" text-lg leading-9 text-white/90">

                            {{ featuredInsight.excerpt }}

                        </p>

                        <!-- Button -->

                        <button (click)="openInsight()"
                            class="inline-flex items-center gap-1 rounded-lg bg-[var(--lotina-gold)] px-6 py-2 text-sm font-medium uppercase tracking-[2px] text-black transition-all duration-300 hover:scale-105 mt-3">

                            Read Full Insight

                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">

                                <path d="M5 12h14" />

                                <path d="M13 5l7 7-7 7" />

                            </svg>

                        </button>

                        <!-- Metadata -->

                        <div class="mt-6 flex flex-wrap gap-5">

                            <!-- Date -->

                            <div
                                class="featured-meta flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-5 py-3 backdrop-blur-md">

                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                    stroke="currentColor" stroke-width="1.8" class="featured-meta-icon">

                                    <path d="M8 2v4" />
                                    <path d="M16 2v4" />
                                    <rect x="3" y="4" width="18" height="17" rx="2" />
                                    <path d="M3 10h18" />

                                </svg>

                                <span class="text-sm text-[var(--lotina-silver)]">

                                    {{ featuredInsight.date }}

                                </span>

                            </div>

                            <!-- Category -->

                            <div
                                class="featured-meta flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-5 py-3 backdrop-blur-md">

                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                    stroke="currentColor" stroke-width="1.8" class="featured-meta-icon">

                                    <path d="M20 12V7a2 2 0 0 0-2-2h-5L3 15l6 6 10-10z" />
                                    <circle cx="16" cy="8" r="1" />

                                </svg>

                                <span class="text-sm text-[var(--lotina-silver)]">

                                    {{ featuredInsight.category }}

                                </span>

                            </div>

                            <!-- Read Time -->

                            <div
                                class="featured-meta flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-5 py-3 backdrop-blur-md">

                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                    stroke="currentColor" stroke-width="1.8" class="featured-meta-icon">

                                    <circle cx="12" cy="12" r="9" />
                                    <path d="M12 7v5l3 2" />

                                </svg>

                                <span class="text-sm text-[var(--lotina-silver)]">

                                    {{ featuredInsight.readTime }}

                                </span>

                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>

</section>
