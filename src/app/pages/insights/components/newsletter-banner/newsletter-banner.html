<section class="bg-[#0B0B0B]">

    <div class="mx-auto w-[92%] max-w-7xl">

        <div
            class="overflow-hidden rounded-2xl border border-[var(--lotina-gold)] bg-[var(--lotina-black)]">

            <div class="grid lg:grid-cols-7">

                <!-- ================= LEFT QUOTE ================= -->

                <div
                    class="lg:col-span-3 flex flex-col justify-center border-r border-white/10 px-12 py-12">

                    <p
                        class="mb-6 text-xs font-semibold uppercase tracking-[3px] text-[var(--lotina-gold)]">

                        {{ sectionTitle }}

                    </p>

                    <h2
                        class="max-w-lg text-[2rem] font-light leading-tight text-white">

                        {{ quote }}

                    </h2>

                </div>

                <!-- ================= RIGHT COLUMNS ================= -->

                @for(item of perspectives; track item.title){

                <div id="newsletter"
                    class="flex flex-col items-center justify-center border-r border-white/10 px-4 py-10 text-center last:border-r-0">

                    <!-- ICON -->

                    @switch(item.icon){

                    @case('innovation'){

                    <svg
                        class="mb-5 h-7 w-7 text-white"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        viewBox="0 0 24 24">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12c.6.7 1 1.5 1 2.5V17h6v-.5c0-1 .4-1.8 1-2.5A7 7 0 0 0 12 2z"/>

                    </svg>

                    }

                    @case('globe'){

                    <svg
                        class="mb-5 h-7 w-7 text-white"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        viewBox="0 0 24 24">

                        <circle cx="12" cy="12" r="9"/>

                        <path d="M3 12h18"/>

                        <path d="M12 3a15 15 0 0 1 0 18"/>

                        <path d="M12 3a15 15 0 0 0 0 18"/>

                    </svg>

                    }

                    @case('handshake'){

                    <svg
                        class="mb-5 h-7 w-7 text-white"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        viewBox="0 0 24 24">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8 12l3 3a2 2 0 0 0 3 0l5-5M3 8l5 5m0-5l2-2a2 2 0 0 1 3 0l1 1"/>

                    </svg>

                    }

                    @case('growth'){

                    <svg
                        class="mb-5 h-7 w-7 text-white"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        viewBox="0 0 24 24">

                        <path d="M4 20V9"/>

                        <path d="M10 20V4"/>

                        <path d="M16 20v-7"/>

                        <path d="M22 20V2"/>

                    </svg>

                    }

                    }

                    <h3
                        class="mb-3 text-[11px] font-semibold uppercase tracking-[2px] text-[var(--lotina-gold)]">

                        {{ item.title }}

                    </h3>

                    <p
                        class="text-sm leading-5 text-neutral-400">

                        {{ item.description }}

                    </p>

                </div>

                }

            </div>

        </div>

    </div>

</section>
