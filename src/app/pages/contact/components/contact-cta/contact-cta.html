<section class="bg-[#F8F9FA] py-24">

    <div class="mx-auto w-[92%] max-w-7xl">

        <!-- Heading -->

        <div class="mx-auto mb-16 max-w-3xl text-center">

            <p
                class="mb-4 text-sm font-semibold uppercase tracking-[4px] text-[var(--lotina-gold)]">

                Frequently Asked Questions

            </p>

            <h2
                class="mb-6 text-5xl font-light text-[var(--lotina-black)]">

                Answers To Common Questions

            </h2>

            <p
                class="text-lg leading-8 text-neutral-600">

                Everything you need to know about working with
                Lotina Investments, partnerships and investment opportunities.

            </p>

        </div>

        <!-- FAQ Grid -->

        <div class="grid gap-6 lg:grid-cols-2">

            @for(faq of faqs; track faq.question; let i = $index){

            <div
                class="overflow-hidden rounded-xl border border-neutral-200 bg-white shadow-sm transition hover:shadow-lg">

                <!-- Question -->

                <button
                    (click)="toggleFaq(i)"
                    class="flex w-full items-center justify-between px-8 py-6 text-left">

                    <span
                        class="pr-6 text-lg font-semibold text-[var(--lotina-black)]">

                        {{ faq.question }}

                    </span>

                    <span
                        class="flex h-10 w-10 items-center justify-center rounded-full bg-[var(--lotina-gold)] text-xl font-bold text-white transition">

                        {{ faq.open ? '−' : '+' }}

                    </span>

                </button>

                <!-- Answer -->

                @if(faq.open){

                <div
                    class="border-t border-neutral-200 px-8 pb-8 pt-6">

                    <p
                        class="leading-8 text-neutral-600">

                        {{ faq.answer }}

                    </p>

                </div>

                }

            </div>

            }

        </div>

    </div>

</section>
