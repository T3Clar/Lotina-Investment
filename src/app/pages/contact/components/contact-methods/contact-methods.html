<section class="bg-[#e7dcdc] py-18">

    <div class="max-w-7xl mx-auto px-6">

        <div
            class="overflow-hidden rounded-2xl border border-white/10 bg-[#0b1118]/95 backdrop-blur">

            <div class="grid md:grid-cols-2 xl:grid-cols-4">

                @for(method of methods; track method.title){

                <div
                    class="border-r border-white/10 last:border-r-0 p-8">

                    <div class="flex flex-col">

                        <!-- ICON -->

                        @switch(method.icon){

                        @case('email'){

                        <svg
                            class="h-9 w-9 text-[var(--lotina-gold)]"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"/>

                            <path d="M3 7l9 7 9-7"/>

                        </svg>

                        }

                        @case('phone'){

                        <svg
                            class="h-9 w-9 text-[var(--lotina-gold)]"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            viewBox="0 0 24 24">

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 4.18 2 2 0 0 1 5.08 2h3a2 2 0 0 1 2 1.72l.38 2.66a2 2 0 0 1-.57 1.71L8.09 9.91a16 16 0 0 0 6 6l1.82-1.82a2 2 0 0 1 1.71-.57l2.66.38A2 2 0 0 1 22 16.92z"/>

                        </svg>

                        }

                        @case('location'){

                        <svg
                            class="h-9 w-9 text-[var(--lotina-gold)]"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            viewBox="0 0 24 24">

                            <path
                                d="M12 21s-6-5.33-6-11a6 6 0 1 1 12 0c0 5.67-6 11-6 11z"/>

                            <circle
                                cx="12"
                                cy="10"
                                r="2"/>

                        </svg>

                        }

                        @case('partnership'){

                        <svg
                            class="h-9 w-9 text-[var(--lotina-gold)]"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            viewBox="0 0 24 24">

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M8 12l3 3a2 2 0 0 0 3 0l5-5M3 8l5 5m0-5l2-2a2 2 0 0 1 3 0l1 1"/>

                        </svg>

                        }

                        }

                        <!-- TEXT -->

                        <div>

                            <h3
                                class="mb-4 text-sm font-semibold uppercase tracking-[2px] text-[var(--lotina-gold)]">

                                {{ method.title }}

                            </h3>

                            <p class="text-white">

                                {{ method.line1 }}

                            </p>

                            <p class="mt-4 text-neutral-400">

                                {{ method.line2 }}

                            </p>

                            @if(method.line3){

                            <p class="text-neutral-400">

                                {{ method.line3 }}

                            </p>

                            }

                        </div>

                    </div>

                </div>

                }

            </div>

        </div>

    </div>

</section>
