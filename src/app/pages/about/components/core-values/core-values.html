<section class="bg-[#090909] pt-18 pb-24">
    <div class="max-w-7xl mx-auto px-8">

        <!-- Section Header -->
        <div class="text-center mb-6">
            <p class="uppercase tracking-[0.35em] text-[#C8A75B] text-xs font-semibold">
                Our Values
            </p>

            <h2 class="mt-4 text-3xl font-light text-white leading-tight">
                Why Choose Lotina Investments
            </h2>
        </div>

        <!-- Cards -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
            @for(value of values; track value.title){
            <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-6 h-full">
                <!-- Title -->
                <h3 class="text-lg font-light text-white">
                    {{ value.title }}
                </h3>

                <!-- Divider -->
                <div class="w-10 h-px bg-[#C8A75B]/60 my-1"></div>

                <!-- Description -->
                <p class="text-gray-400 text-sm leading-6">
                    {{ value.description }}
                </p>
            </div>
            }
        </div>

    </div>
</section>
