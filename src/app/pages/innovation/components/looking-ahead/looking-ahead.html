<section class="bg-[#070707]">

    <div class="mx-auto grid w-[92%] max-w-7xl items-center gap-12 py-12 lg:min-h-[580px] lg:grid-cols-2">
        <!-- Image -->

        <div class="group relative h-[320px] overflow-hidden rounded-3xl sm:h-[380px] lg:h-[460px]">

            <img src="/llllll.png" alt="Looking Ahead"
                class="h-full w-full  transition duration-700  object-top group-hover:scale-105">
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent">
            </div>

            <div class="absolute bottom-10 left-10">

                <p class=" uppercase tracking-[4px] text-sm text-[var(--lotina-gold)]">
                    Future Ventures Across Africa
                </p>

            </div>

        </div>

        <!-- Content -->

        <div>

            <p class="mb-2 text-sm font-medium uppercase tracking-[4px] text-[var(--lotina-gold)]">

                Looking Ahead

            </p>

            <h2 class="mb-3 text-3xl font-light leading-tight text-[var(--lotina-white)] lg:text-4xl">

                Building Tomorrow,
                <br>
                Starting Today.

            </h2>

            <p class="mb-5 text-lg leading-9 text-[var(--lotina-silver)]">
                We are creating and backing the ventures of tomorrow across high-growth, high-impact opportunities.

            </p>

            <!-- Future Pillars -->

            <div class="grid gap-2">

                @for(item of pillars; track item){

                <div
                    class="group flex items-center gap-5 rounded-xl border border-[#222] bg-[#1a1c1f] px-6 py-2 transition-all duration-300 ">

                    <!-- Check Icon -->

                    <div
                        class="flex h-11 w-11 items-center justify-center rounded-full bg-black transition-all duration-300">

                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2"
                            class="text-[var(--lotina-gold)] transition-all duration-300">

                            <path d="M20 6L9 17l-5-5" />

                        </svg>

                    </div>

                    <span class="text-lg text-[var(--lotina-white)] transition-colors duration-300 ">

                        {{ item }}

                    </span>

                </div>

                }

            </div>

            <!-- Button -->

            <div class="mt-14">

                <a routerLink="/insights"
                    class="inline-flex items-center gap-3 rounded-full border border-[var(--lotina-gold)] px-8 py-4 text-sm uppercase tracking-[3px] text-[var(--lotina-gold)] transition-all duration-300 hover:bg-[var(--lotina-gold)] hover:text-black">

                    Discover More

                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <path d="M5 12h14" />
                        <path d="M13 5l7 7-7 7" />

                    </svg>

                </a>

            </div>

        </div>

    </div>

</section>
