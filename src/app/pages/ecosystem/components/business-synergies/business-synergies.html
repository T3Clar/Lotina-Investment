<section class="bg-[#e7dcdc] py-18">

    <div class="max-w-7xl mx-auto px-6">

        <!-- Heading -->

        <div class="text-center max-w-3xl mx-auto">

            <p
                class="uppercase tracking-[0.35em] text-[#f8af06] text-sm">

                Our Portfolio

            </p>

            <h2
                class="mt-5 text-5xl font-light text-black">

                Meet the Companies
                <br>
                Powering Our Ecosystem

            </h2>

           
        </div>

        <!-- Cards -->

        <div
            class="grid
                   lg:grid-cols-3
                   md:grid-cols-2
                   gap-8
                   mt-20">

            @for(company of companies; track company.name){

            <div
                class="group
                       relative
                       h-[420px]
                       rounded-3xl
                       overflow-hidden
                       cursor-pointer">

                <!-- Background -->

                <img
                    [src]="company.image"
                    [alt]="company.name"
                    class="absolute inset-0
                           w-full
                           h-full
                           
                           transition
                           duration-700
                           group-hover:scale-110">

                <!-- Overlay -->

                <div
                    class="absolute inset-0
                           bg-gradient-to-t
                           from-black
                           via-black/55
                           to-black/15
                           group-hover:from-black
                           transition">
                </div>

                <!-- Content -->

                <div
                    class="relative
                           h-full
                           flex
                           flex-col
                           justify-end
                           p-8">

                    
                    <h3
                        class="text-3xl
                               text-white
                               font-light">

                        {{company.name}}

                    </h3>

                    <p
                        class="text-gray-300
                               mt-3
                               leading-7">

                        {{company.description}}

                    </p>

                    <div
                        class="mt-8
                               flex
                               items-center
                               gap-3
                               text-[#C8A75B]
                               opacity-0
                               translate-y-5
                               transition-all
                               duration-500
                               group-hover:opacity-100
                               group-hover:translate-y-0">

                        <span>Explore</span>

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor">

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M5 12h14m-6-6 6 6-6 6"/>

                        </svg>

                    </div>

                </div>

            </div>

            }

        </div>

    </div>

</section>
